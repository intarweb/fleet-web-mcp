[project]
name = "fleet-web-mcp"
version = "0.1.0"
description = "MCP front end for a bd-server (BrightData) fetch/scrape service, with a timeout long enough for slow pages."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
fleet-web-mcp = "fleet_web_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_web_mcp"]
